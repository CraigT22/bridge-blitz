name: Deploy PWA & Build Pixel APK

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pwa:
    name: Build & Deploy GitHub Pages PWA
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production PWA bundle
        run: |
          npm run build
          touch dist/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

      - name: Auto-enable GitHub Pages (Actions source)
        id: pages_cfg
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.pages_cfg.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages_cfg.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

  build-pixel-apk:
    name: Compile Android APK (Pixel 10 XL)
    needs: deploy-pwa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK & accept API 36 licenses
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Install web dependencies & sync Capacitor Android
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Assemble Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Package BridgeBlitz-Pixel10XL.apk
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk BridgeBlitz-Pixel10XL.apk
          cp BridgeBlitz-Pixel10XL.apk apk-out/BridgeBlitz-Pixel10XL.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BridgeBlitz-Pixel10XL-APK
          path: BridgeBlitz-Pixel10XL.apk

      - name: Publish direct Chrome APK to gh-pages/download
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apk-out
          destination_dir: download
          keep_files: true
          publish_branch: gh-pages

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.1.0
          name: Bridge Blitz v7.1.0 — Girls vs. Boys Unicorn Magic Skin Toggle APK
          body: |
            ### Bridge Blitz v7.1.0 — Girls vs. Boys Unicorn Magic Skin Toggle (`versionCode 16`)
            - **Direct Chrome Download (installs cleanly over v7.0 while keeping saved progress!)**: [BridgeBlitz-Pixel10XL.apk](https://raw.githubusercontent.com/CraigT22/bridge-blitz/gh-pages/download/BridgeBlitz-Pixel10XL.apk?v=16)
            - **What's New in v7.1**:
              - **Live Bidirectional Skin Toggle (`TACTICAL` ⇄ `UNICORN`)**: Instant O(1) 1-tap skin switch on the Live-Bridge Hub (`#btn-hub-skin-toggle`), in Settings (`#btn-toggle-skin`), and in the Mid-Run Pause Modal (`#btn-pause-skin`), persisted automatically in `SaveDataV1`.
              - **Girls in Pink Outfits & Helmets vs. Boys in Royal-Blue & Kelly-Green Outfits**: Sculpted Pink Girl squad in bubblegum-pink pleated outfits, pearl-white boots, twin blonde ponytails, and golden-crested pink helmets battling 50/50 mixed battalions of rival Boys in Royal-Blue & Kelly-Green sporty outfits, Varsity Boy Captains, and Giant Varsity Boy Champ brutes wielding Foam Bopper Hammers.
              - **All 5 Weapons Reimagined as Unicorn Magic Horns & Wands**: **Sparkle Star Wand** (`Lv1`), **Spiral Unicorn Horn** (`Lv2`), **Pegasus Wing Wand** (`Lv3`), **Rainbow Prism Horn** (`Lv4` spinning 6-horn rainbow carousel), and **Royal Alicorn Wand** (`Lv5` sculpted unicorn head + blazing spiral horn + 3 halo rings) firing starlight magic bolts with 100% `v7.0` tactical DPS parity.
          files: BridgeBlitz-Pixel10XL.apk
