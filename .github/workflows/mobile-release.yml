name: Deploy PWA & Build Pixel APK

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pwa:
    name: Build & Deploy GitHub Pages PWA
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production PWA bundle
        run: |
          npm run build
          touch dist/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

      - name: Auto-enable GitHub Pages (Actions source)
        id: pages_cfg
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.pages_cfg.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages_cfg.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

  build-pixel-apk:
    name: Compile Android APK (Pixel 10 XL)
    needs: deploy-pwa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK & accept API 36 licenses
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Install web dependencies & sync Capacitor Android
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Assemble Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Package BridgeBlitz-Pixel10XL.apk
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk BridgeBlitz-Pixel10XL.apk
          cp BridgeBlitz-Pixel10XL.apk apk-out/BridgeBlitz-Pixel10XL.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BridgeBlitz-Pixel10XL-APK
          path: BridgeBlitz-Pixel10XL.apk

      - name: Publish direct Chrome APK to gh-pages/download
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apk-out
          destination_dir: download
          keep_files: true
          publish_branch: gh-pages

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.3.0
          name: Bridge Blitz v5.3.0 — Comprehensive Visual, Audio & Gameplay Polish APK
          body: |
            ### Bridge Blitz v5.3.0 — Pixel 10 XL Comprehensive Polish Release (`versionCode 12`)
            - **Direct Chrome Download (installs cleanly over v5.2 while keeping saved progress!)**: [BridgeBlitz-Pixel10XL.apk](https://raw.githubusercontent.com/CraigT22/bridge-blitz/gh-pages/download/BridgeBlitz-Pixel10XL.apk?v=12)
            - **What's Upgraded in v5.3**:
              - **Visual & Cel Readability**: Throttled hit-flashes so Tire Walls stay deep black rubber and Goliaths retain rich crimson armor under 40-gun fire; Boss cel-saturation & GLSL ES normal hardening; unobscured gate numerals with vertical micro scale-pops; aimed muzzle flashes; Campaign bridge terminus overlooking open ocean water; stationary ready stance on `PRE_RUN` & un-aggroed sentry enemies.
              - **Gameplay & HUD**: Early Boss HP bar reveal on approach; Goliath aimed smash + inner timing disc; Juggernaut-priority mini HP bars; Armory framing & `Lv5` stat meters; tactile upgrade purchase card pop; monotonic 10-stage Goliath HP curve.
              - **Audio**: Cached white-noise impact transients, crowd-scaled gunfire (`1→40`), and throttled coin pickup chime.
          files: BridgeBlitz-Pixel10XL.apk
