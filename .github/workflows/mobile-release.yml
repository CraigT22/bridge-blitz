name: Deploy PWA & Build Pixel APK

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pwa:
    name: Build & Deploy GitHub Pages PWA
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production PWA bundle
        run: |
          npm run build
          touch dist/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

      - name: Auto-enable GitHub Pages (Actions source)
        id: pages_cfg
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.pages_cfg.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages_cfg.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

  build-pixel-apk:
    name: Compile Android APK (Pixel 10 XL)
    needs: deploy-pwa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK & accept API 36 licenses
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Install web dependencies & sync Capacitor Android
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Assemble Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Package BridgeBlitz-Pixel10XL.apk
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk BridgeBlitz-Pixel10XL.apk
          cp BridgeBlitz-Pixel10XL.apk apk-out/BridgeBlitz-Pixel10XL.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BridgeBlitz-Pixel10XL-APK
          path: BridgeBlitz-Pixel10XL.apk

      - name: Publish direct Chrome APK to gh-pages/download
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apk-out
          destination_dir: download
          keep_files: true
          publish_branch: gh-pages

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.1.0
          name: Bridge Blitz v8.1.0 — Heroic 3/4 Framing, Object Scale & Split Causeway Physics Overhaul APK
          body: |
            ### Bridge Blitz v8.1.0 — Heroic 3/4 Framing, Object Scale & Split Causeway Physics Overhaul (`versionCode 21`)
            - **Direct Chrome Download (installs cleanly over v8.0 / v7.4 while keeping saved progress!)**: [BridgeBlitz-Pixel10XL.apk](https://raw.githubusercontent.com/CraigT22/bridge-blitz/gh-pages/download/BridgeBlitz-Pixel10XL.apk?v=21)
            - **What's New in v8.1**:
              - **Heroic 3/4 Over-the-Shoulder Portrait Framing (~22.5° Pitch, 62° FOV & Open Horizon)**: Re-engineered the camera (`LIVE_BRIDGE`, `RUN_TACTICAL`, `BOSS_TACTICAL`) so the Midnight Storm Viaduct sky, full moon, and suspension skyline sit visibly in the top ~16%, the squad anchors at ~60% with ~39% open lower deck for thumb swiping, and responsive `~44%` lateral follow centers outer-lane & Split Causeway action smoothly.
              - **Larger, Punchier Hero & World Proportions**: Scaled player soldiers (`1.66×`), regular enemies (`1.62×`), heavy captains (`2.10×`), Standard Bridge rolling barrels (`1.24×`), Split Causeway left-column barrels (`1.46×` wide), Holo-Gates (`2.92m`), and magnetized spinning 3D gold coins (`1.44×`) with proportional contact shadows, crisp cel outlines, and matched hitboxes.
              - **Crisp Shorter Bolts & Early-Squad Shoulder Spacing**: Trimmed Lv1 streaks (`0.94m`) and Lv2–Lv5 arrowheads (`1.06m`) so rapid 40-girl streams stay sharp and readable over enemies and hit-flashes, while giving 2–3 early soldiers clean `1.12m` shoulder-to-shoulder spacing and 4–40 squads a compact `~1.4`-lane honeycomb.
              - **Split Causeway Conveyor Rhythm & Post-Divider Fan-Out Pursuit**: Centered the Split Causeway Hub squad (`x = 0`), raised the armored divider wall to `3.65m`, tightened the left barrel+gate conveyor (`8.8m` front, `5.45m` spacing) with raised unobstructed `+2`/`×1.5` gate panels, enriched organic enemy cluster jitter, and added natural lateral fan-out pursuit for enemies clearing the divider prow.
              - **Snappier Close-Quarters Combat**: Tuned active engagement range (`34m` Standard / `38m` Split) while preserving default Girls vs. Boys Unicorn skin, Tactical skin toggle, all `v8.0` mechanics, `>= 42m` gate-to-wave clearance, and `>= 32m` standoff shield.
          files: BridgeBlitz-Pixel10XL.apk
