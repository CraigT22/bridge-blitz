name: Deploy PWA & Build Pixel APK

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pwa:
    name: Build & Deploy GitHub Pages PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production PWA bundle
        run: |
          npm run build
          touch dist/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: true

  build-pixel-apk:
    name: Compile Android APK (Pixel 10 XL)
    needs: deploy-pwa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK & accept API 36 licenses
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Install web dependencies & sync Capacitor Android
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Assemble Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Package BridgeBlitz-Pixel10XL.apk
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk BridgeBlitz-Pixel10XL.apk
          cp BridgeBlitz-Pixel10XL.apk apk-out/BridgeBlitz-Pixel10XL.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BridgeBlitz-Pixel10XL-APK
          path: BridgeBlitz-Pixel10XL.apk

      - name: Publish direct Chrome APK to gh-pages/download
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apk-out
          destination_dir: download
          keep_files: true
          publish_branch: gh-pages

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.2.0
          name: Bridge Blitz v8.2.0 — Skill + Progression Difficulty Overhaul APK
          body: |
            ### Bridge Blitz v8.2.0 — Skill + Progression Difficulty Overhaul (`versionCode 22`)
            - **Direct Chrome Download (installs cleanly over v8.1 / v8.0 / v7.4 while keeping saved progress!)**: [BridgeBlitz-Pixel10XL.apk](https://raw.githubusercontent.com/CraigT22/bridge-blitz/gh-pages/download/BridgeBlitz-Pixel10XL.apk?v=22)
            - **What's New in v8.2**:
              - **4 Active Combat Threats (Full Parity on Standard Bridge & Split Causeway)**:
                - **Ranged Enemy Shooters**: Backline units telegraph with a glowing charge orb and fire lane-locked bolts straight down-lane (`vx = 0`) that inflict real casualties unless dodged.
                - **Armored Lane Chargers**: Heavy vanguard units lock a glowing ground rush lane and sprint at `2.85×` speed (`2.15×` on Split Causeway); stopping them mid-charge awards `1.5×` bonus coins (`CHARGER STOPPED!`), while impact inflicts heavy bonus casualties.
                - **2-Lane Rolling Barrel Gauntlets & Spiked Hazard Drums**: Coordinated 2-lane rolling walls featuring red-banded 3D **Spiked Hazard Drums** with rotating spikes, crimson `!` warning triangles, lethal-capable crash casualties (no artificial immortality floor), and clean `14m` behind-barricade standoff so rolling drums never clip through standing walls.
                - **Dilemma & Trap Gates**: Steeper shoot-to-flip resistance, snappier passive decay (`0.32s` grace), and locked crimson penalty gates (`÷2` / `-7..-16`) paired opposite tough shootable gates.
              - **Mid-Boss & Final Boss Overhaul**:
                - **Final Bosses**: Alternating **2-lane telegraphed salvos starting from Sector 1** across Campaign, Split Causeway, and Endless modes; **50% HP Enrage Phase** (glowing aura, `• ENRAGED!` Boss HUD, faster salvos & warheads) + periodic **Escort Squad Summons** (and pre-enrage summons at 75% HP on Hard/Nightmare), plus `1.45m` pushback recoil & `0.65s` stagger on Armor Segment break.
                - **Mid-Boss Brutes**: Faster combat cadence + alternating **Wide 2-Lane Shockwave Slams (`3.10m` radius)** with forward lunge.
              - **Difficulty Tiers (`NORMAL 1×` / `HARD 1.5×` / `NIGHTMARE 2.25×`) & Smooth Diminishing-Returns Hub Upgrades**:
                - Selectable Hub Difficulty Tier bar persisted in save data, scaling enemy HP, speed, drum HP, gate cost, boss HP/tempo, shooter/charger cadence, bolt damage, and coin multipliers (`1×` / `1.5×` / `2.25×`) with live top-HUD badge and summary multiplier readout.
                - Re-calibrated base bullet damage (`3.1`), slower ebb-and-flow squad ramp, and smooth hyperbolic Hub upgrade scaling while preserving all saved coins, upgrades, unlocked stages, `v8.1` heroic framing/scales, Girls vs. Boys Unicorn default skin + Tactical toggle, `>= 42m` gate-to-wave clearance, and persistent Split Causeway Left-Column barrel HP.
          files: BridgeBlitz-Pixel10XL.apk
