name: Deploy PWA & Build Pixel APK

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pwa:
    name: Build & Deploy GitHub Pages PWA
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production PWA bundle
        run: |
          npm run build
          touch dist/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

      - name: Auto-enable GitHub Pages (Actions source)
        id: pages_cfg
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.pages_cfg.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages_cfg.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

  build-pixel-apk:
    name: Compile Android APK (Pixel 10 XL)
    needs: deploy-pwa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK & accept API 36 licenses
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Install web dependencies & sync Capacitor Android
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Assemble Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Package BridgeBlitz-Pixel10XL.apk
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk BridgeBlitz-Pixel10XL.apk
          cp BridgeBlitz-Pixel10XL.apk apk-out/BridgeBlitz-Pixel10XL.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BridgeBlitz-Pixel10XL-APK
          path: BridgeBlitz-Pixel10XL.apk

      - name: Publish direct Chrome APK to gh-pages/download
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apk-out
          destination_dir: download
          keep_files: true
          publish_branch: gh-pages

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.0.0
          name: Bridge Blitz v8.0.0 — Parallel Garden Hose, Rolling Barrels & Arcade Feel Overhaul APK
          body: |
            ### Bridge Blitz v8.0.0 — Parallel Garden Hose, Rolling Barrels & Arcade Feel Overhaul (`versionCode 20`)
            - **Direct Chrome Download (installs cleanly over v7.4 while keeping saved progress!)**: [BridgeBlitz-Pixel10XL.apk](https://raw.githubusercontent.com/CraigT22/bridge-blitz/gh-pages/download/BridgeBlitz-Pixel10XL.apk?v=20)
            - **What's New in v8.0**:
              - **Parallel Straight-Ahead "Garden Hose" Staggered Firing & Compact Squad Blob**: Removed focal-point convergence (`vx = 0`) with golden-ratio staggered per-soldier fire timers so lateral swipes paint a silky diagonal ribbon of rainbow/tactical fire from a compact `~1.35`-lane oval blob.
              - **Arcade Center-Clamped Outer-Lane Movement (100% Outer-Lane DPS)**: Clamps squad center to `±4.85m` so flanking soldiers visually overhang the curb while off-curb bullets clamp onto the playable `±5.10m` rail for full outer-lane DPS.
              - **Locked-Center 3-Lane 35° Camera**: Rigid forward Z tracking + `~20%` damped lateral follow + `35°` downward pitch keeps both guardrails and all 3 lanes permanently in frame on 9:16 portrait (`412×915`).
              - **Shoot-to-Charge Gate Passive Decay**: Shootable `+` and `×` gates decay smoothly back toward spawn after a `0.45s` grace pause (including blue→red reversion) with an amber-crimson tick-down pulse and audio cue.
              - **Lane-Aligned Rolling Barrels, Popping Tire Debris & Flying Weapon Pickups**: Rolling barrels translate down-lane rotating around local X (dealing squad attrition on collision instead of instant run wipe, rolling harmlessly past when dodged), shattered barricades burst into a stylized cartoon fireball + ground shockwave + popping 3D tires, and weapon pickups fly oversized straight into the squad with a golden/rainbow burst.
              - **Split-Body Strafe, Solid-White Hit-Flash, Instant Pop, Tiered Projectiles & Magnetized 3D Coins**: Decoupled diagonal striding legs with locked-forward torsos, instant enemy pop into sparks + magnetized spinning 3D coins flying into the top-right HUD counter, tiered Lv1 slender streaks → Lv2–Lv5 swept arrowheads with trailing sparks (Unicorn & Tactical), Split Causeway divider-straddling dual-column fire with persistent Left-Column HP, and `+18.5%` faster forward march pace while preserving `>= 42m` gate-to-wave clearance and `>= 32m` standoff shield.
          files: BridgeBlitz-Pixel10XL.apk
